# ============================================================
# Clash Party 覆写配置 - 港澳地区 Special 版 (rule_special.yaml)
# 适用：香港 / 澳门本地网络（以澳门为主），单节点场景
# 逻辑：默认全部直连（港澳网络开放），仅「港澳也无法访问」的服务走节点：
#   - OpenAI / ChatGPT / Sora（OpenAI 主动封锁港澳，2026-06 确认）
#   - Anthropic / Claude（封锁港澳 IP）
#   - Google AI 开发者工具（AI Studio / Gemini API / NotebookLM /
#     Gemini CLI / Antigravity 仍封锁；Gemini 网页版已开放，直连）
#   - Hulu / Peacock / Paramount+ 美区 / BBC iPlayer / Pluto TV / Tubi
# 备注：TikTok 澳门可直连，默认不代理（香港不可用，赴港时取消文末注释即可）。
# 无需 DNS 防泄露组件的反向堆叠：港澳无 DNS 污染，代理域名由 fake-ip
# + respect-rules 自动远端解析。
# ============================================================

mode: rule
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

# ============================================================
# 域名嗅探
# ============================================================
sniffer!:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ============================================================
# TUN 与 DNS
# ============================================================
tun!:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: true

dns!:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "geosite:private"
    - "geosite:cn"
    - "geosite:apple-cn"
    - "geosite:microsoft@cn"
    - "geosite:steam@cn"
    - "geosite:category-games@cn"
    - "+.lan"
    - "+.local"
    - "+.localhost"
    - "localhost.ptlogin2.qq.com"
    - "dns.msftncsi.com"
    - "www.msftconnecttest.com"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "+.market.xiaomi.com"
    - "+.push.apple.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "time1.*.com"
    - "time2.*.com"
    - "time3.*.com"
    - "time4.*.com"
    - "time5.*.com"
    - "time6.*.com"
    - "time7.*.com"
    - "*.ntp.org.cn"
    - "*.pool.ntp.org"

  # 仅用于解析 DNS 服务器域名，必须是 IP 或基于 IP 的加密 DNS。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 1.1.1.1
    - 8.8.8.8

  # 港澳无 DNS 污染，默认用公共加密 DNS 即可。
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

  # 节点域名解析走公共 DNS（港澳无污染，无需递归保护）。
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

  # 国内域名仍用国内 DoH，保证微信/支付宝/B站等 CN CDN 命中；
  # 代理域名走海外 DoH，与规则出口保持一致。
  nameserver-policy:
    "geosite:private,cn,apple-cn,microsoft@cn,steam@cn,category-games@cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "rule-set:domestic_sensitive,domestic_ai_domain,tencent_services,tencent_games_static":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "rule-set:openai_domain,anthropic_domain,google_ai_dev,hulu_domain,streaming_special":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query

  respect-rules: true

# ============================================================
# Geo 数据库
# ============================================================
geodata-mode: true
geox-url!:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"
geo-auto-update: true
geo-update-interval: 24

# ============================================================
# 代理组：单节点场景精简
# ============================================================
proxy-groups:
  - name: "🚀 节点选择"
    type: select
    include-all: true
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    proxies:
      - "♻️ 自动选择"
      - DIRECT

  - name: "♻️ 自动选择"
    type: url-test
    include-all: true
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    timeout: 5000

  - name: "🤖 AI 解锁"
    type: select
    proxies:
      - "🚀 节点选择"
      - DIRECT

  - name: "🎬 流媒体解锁"
    type: select
    proxies:
      - "🚀 节点选择"
      - DIRECT

  - name: "🛑 广告拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: "🎯 全球直连"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"

# ============================================================
# 规则集
# 港澳场景大幅精简：不需要 cn/geolocation 兜底（MATCH 即直连），
# 只保留「广告拦截」+「直连保护」+「港澳不可用的代理集」。
