# ============================================================
# Clash Party 覆写配置 - 多节点通用版 (rule_multi.yaml)
# 目标：支持任意数量节点的分组合适（日本/新加坡/美国/香港/台湾）
# 通用设计：每个地区通过 include-all + filter 正则自动匹配节点，
#          更换订阅后节点只要名称中包含地区关键词即可自动归入对应分组。
#          无任何硬编码节点名。
# 兼容：系统代理 / TUN / mix(TUN+系统代理) 三种模式
# 说明：这是 Clash Party YAML 覆写文件，不是独立 mihomo 配置文件。
# ============================================================

mode: rule
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true

# ============================================================
# 域名嗅探
# ============================================================
sniffer!:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ============================================================
# TUN 与 DNS 防泄露
# ============================================================
tun!:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: true

dns!:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "geosite:private"
    - "geosite:cn"
    - "geosite:apple-cn"
    - "geosite:microsoft@cn"
    - "geosite:steam@cn"
    - "geosite:category-games@cn"
    - "+.lan"
    - "+.local"
    - "+.localhost"
    - "localhost.ptlogin2.qq.com"
    - "dns.msftncsi.com"
    - "www.msftconnecttest.com"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "+.market.xiaomi.com"
    - "+.push.apple.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "time1.*.com"
    - "time2.*.com"
    - "time3.*.com"
    - "time4.*.com"
    - "time5.*.com"
    - "time6.*.com"
    - "time7.*.com"
    - "*.ntp.org.cn"
    - "*.pool.ntp.org"

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - tls://223.5.5.5

  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  direct-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver-follow-policy: true

  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  nameserver-policy:
    "geosite:private,cn,apple-cn,microsoft@cn,steam@cn,category-games@cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "rule-set:domestic_sensitive,domestic_ai_domain,tencent_services,tencent_games_static":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "rule-set:ai_static,ai_domain,telegram_domain,youtube_domain,academic_platforms,google_proxy_static,google_domain,github_domain,streaming_static,netflix_domain,disney_domain,hbo_domain,hulu_domain,primevideo_domain,spotify_domain,tiktok_domain,apple_tv_domain,discoveryplus_domain,bahamut_domain,biliintl_domain,geolocation_not_cn":
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query

  respect-rules: true

# ============================================================
# Geo 数据库
# ============================================================
geodata-mode: true
geox-url!:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"
geo-auto-update: true
geo-update-interval: 24

# ============================================================
# 代理组：多节点通用版
# 每个地区独立一个组，通过 include-all + filter 正则自动匹配节点。
# 更换订阅后节点只要名称中包含地区关键词即可自动归入对应分组。
# 如果你的订阅节点命名习惯不同，调整各组的 filter 正则即可。
# ============================================================
proxy-groups:
  # 全球直连
  - name: "🎯 全球直连"
    type: select
    proxies:
      - "DIRECT"
      - "🚀 节点选择"

  # ── 香港 ──
  - name: "🇭🇰 香港"
    type: select
    include-all: true
    filter: "(?i)(香港|Hong\\s*Kong|HK|HKT|HGC|CMI|WTT|葵涌|沙田|将军澳|大埔)"
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    proxies:
      - "🚀 节点选择"
      - DIRECT

  # ── 台湾 ──
  - name: "🇹🇼 台湾"
    type: select
    include-all: true
    filter: "(?i)(台湾|Taiwan|TW|台北|Taipei|Hinet|CHT|是方|台中|高雄|中华电信|远传)"
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    proxies:
      - "🚀 节点选择"
      - DIRECT

  # ── 日本（自动/手动 二级分组）──
  - name: "🇯🇵 日本"
    type: select
    proxies:
      - "🇯🇵 日本-自动"
      - "🇯🇵 日本-手动"
      - DIRECT

  - name: "🇯🇵 日本-自动"
    type: url-test
    include-all: true
    filter: "(?i)(日本|Japan|JP|东京|Tokyo|Osaka|大阪|NTT|IIJ|KDDI|软银|Soft[Bb]ank|樱花|Sakura)"
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    proxies:
      - "🇭🇰 香港"
      - "🇸🇬 新加坡"
      - "🇺🇸 美国"
      - "🚀 节点选择"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    timeout: 5000

  - name: "🇯🇵 日本-手动"
    type: select
    include-all: true
    filter: "(?i)(日本|Japan|JP|东京|Tokyo|Osaka|大阪|NTT|IIJ|KDDI|软银|Soft[Bb]ank|樱花|Sakura)"
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    proxies:
      - "🇯🇵 日本-自动"
      - "🚀 节点选择"

  # ── 新加坡（自动/手动 二级分组）──
  - name: "🇸🇬 新加坡"
    type: select
    proxies:
      - "🇸🇬 新加坡-自动"
      - "🇸🇬 新加坡-手动"
      - DIRECT

  - name: "🇸🇬 新加坡-自动"
    type: url-test
    include-all: true
    filter: "(?i)(新加坡|Singapore|SG|星和|StarHub|M1|Sing[Tt]el)"
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    proxies:
      - "🇭🇰 香港"
      - "🇯🇵 日本"
      - "🇺🇸 美国"
      - "🚀 节点选择"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    timeout: 5000

  - name: "🇸🇬 新加坡-手动"
    type: select
    include-all: true
    filter: "(?i)(新加坡|Singapore|SG|星和|StarHub|M1|Sing[Tt]el)"
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    proxies:
      - "🇸🇬 新加坡-自动"
      - "🚀 节点选择"

  # ── 美国（自动/手动 二级分组）──
  - name: "🇺🇸 美国"
    type: select
    proxies:
      - "🇺🇸 美国-自动"
      - "🇺🇸 美国-手动"
      - DIRECT

  - name: "🇺🇸 美国-自动"
    type: url-test
    include-all: true
    filter: "(?i)(美国|USA?|US|United\\s*States|洛杉矶|Los\\s*Angeles|圣何塞|San\\s*Jose|西雅图|Seattle|纽约|New\\s*York|芝加哥|Chicago|硅谷|Silicon\\s*Valley|达拉斯|Dallas|凤凰城|Phoenix|亚特兰大|Atlanta|迈阿密|Miami|波特兰|Portland|弗里蒙特|Fremont|圣克拉拉|Santa\\s*Clara|阿什本|Ashburn|丹佛|Denver|休斯顿|Houston|拉斯维加斯|Las\\s*Vegas|弗吉尼亚|Virginia|华盛顿|Washington|水牛城|Buffalo|坦帕|Tampa|盐湖城|Salt\\s*Lake)"
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    proxies:
      - "🇭🇰 香港"
      - "🇹🇼 台湾"
      - "🇯🇵 日本"
      - "🇸🇬 新加坡"
      - "🚀 节点选择"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    timeout: 5000

  - name: "🇺🇸 美国-手动"
    type: select
    include-all: true
    filter: "(?i)(美国|USA?|US|United\\s*States|洛杉矶|Los\\s*Angeles|圣何塞|San\\s*Jose|西雅图|Seattle|纽约|New\\s*York|芝加哥|Chicago|硅谷|Silicon\\s*Valley|达拉斯|Dallas|凤凰城|Phoenix|亚特兰大|Atlanta|迈阿密|Miami|波特兰|Portland|弗里蒙特|Fremont|圣克拉拉|Santa\\s*Clara|阿什本|Ashburn|丹佛|Denver|休斯顿|Houston|拉斯维加斯|Las\\s*Vegas|弗吉尼亚|Virginia|华盛顿|Washington|水牛城|Buffalo|坦帕|Tampa|盐湖城|Salt\\s*Lake)"
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    proxies:
      - "🇺🇸 美国-自动"
      - "🚀 节点选择"

# ============================================================
# 节点选择（所有节点入口）
# ============================================================
proxy-groups:
  - name: "🚀 节点选择"
    type: select
    include-all: true
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    proxies:
      - "♻️ 自动选择"
      - DIRECT
      - "🇭🇰 香港"
      - "🇹🇼 台湾"
      - "🇯🇵 日本"
      - "🇸🇬 新加坡"
      - "🇺🇸 美国"

  - name: "♻️ 自动选择"
    type: url-test
    include-all: true
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    timeout: 5000

# ============================================================
