# 08 · 首条命中分流：专项优先，兜底最后
rules:
  # 私网
  - "RULE-SET,private_domain,🎯 全球直连"
  - "RULE-SET,private_ip,🎯 全球直连,no-resolve"
  # 国内敏感服务、中国 AI、腾讯与游戏直连保护
  - "RULE-SET,domestic_sensitive,🎯 全球直连"
  - "RULE-SET,domestic_ai_domain,🎯 全球直连"
  - "RULE-SET,tencent_services,🎯 全球直连"
  - "RULE-SET,tencent_games_static,🎯 全球直连"
  # 广告与遥测
  - "RULE-SET,ads_domain,🛑 广告拦截"
  - "RULE-SET,telemetry_domain,🛑 广告拦截"
  # 指定 AI 开发工具、OpenAI、Anthropic
  # STUN UDP 随 AI 出口，防止 WebRTC 检测回落到港澳本地直连。
  - "DOMAIN,stun.l.google.com,🤖 AI 解锁"
  - "DOMAIN,stun1.l.google.com,🤖 AI 解锁"
  - "DOMAIN,stun.cloudflare.com,🤖 AI 解锁"
  - "RULE-SET,google_ai_dev,🤖 AI 解锁"
  - "RULE-SET,openai_domain,🤖 AI 解锁"
  - "RULE-SET,anthropic_domain,🤖 AI 解锁"
  - "DOMAIN-SUFFIX,chat.com,🤖 AI 解锁"
  # OpenRouter 明确使用 AI 出口；其余补充 AI 保留可选的默认方向。
  - "DOMAIN-SUFFIX,openrouter.ai,🤖 AI 解锁"
  # 自定义代理与 AI 备选
  - "RULE-SET,custom_proxy_domain,🤖 AI 解锁"
  - "RULE-SET,overseas_ai_extra,🧪 AI 备选"
  # 指定流媒体
  - "RULE-SET,hulu_domain,🎬 流媒体解锁"
  - "RULE-SET,streaming_special,🎬 流媒体解锁"
  # 其余直连
  - "MATCH,🎯 全球直连"
