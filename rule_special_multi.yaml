# ============================================================
# Clash Party 覆写配置 - 港澳地区多地区节点版 (rule_special_multi.yaml)
# 适用：香港 / 澳门本地网络（以澳门为主），多地区多节点场景
# 场景：按香港/台湾/日本/新加坡/美国分组，AI 和流媒体可独立选择地区或节点。
# 逻辑：默认直连，仅配置指定的 AI / 流媒体走节点，不保证实时地区可用性。
# Gemini 网页域名、TikTok 默认直连；TikTok 启用代理需同时添加规则集、DNS 策略和路由。
# 默认 DNS 使用公共 DoH；respect-rules 按 DNS 连接自身的目标匹配路由，
# 不代表 DNS 查询与对应业务使用同一代理出口。
# ============================================================

mode: rule
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

# ============================================================
# 域名嗅探
# ============================================================
sniffer!:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ============================================================
# TUN 与 DNS
# ============================================================
tun!:
  enable: true
  stack: mixed
  auto-route: true
  # 注意：TUN 的开关、栈、DNS 劫持与自动探测均以客户端应用设置为准，此处的
  # auto-detect-interface 可能被覆盖。实测关闭后港澳场景出现全网 DNS 失效，
  # 因此保持应用默认（true），不在此处改动。
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: true

dns!:
  enable: true
  cache-algorithm: arc
  listen: 127.0.0.1:1053
  ipv6: false
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "geosite:private"
    - "geosite:cn"
    - "geosite:apple-cn"
    - "geosite:microsoft@cn"
    - "geosite:steam@cn"
    - "geosite:category-games@cn"
    - "+.lan"
    - "+.local"
    - "+.localhost"
    - "localhost.ptlogin2.qq.com"
    - "dns.msftncsi.com"
    - "www.msftconnecttest.com"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "+.market.xiaomi.com"
    - "+.push.apple.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "time1.*.com"
    - "time2.*.com"
    - "time3.*.com"
    - "time4.*.com"
    - "time5.*.com"
    - "time6.*.com"
    - "time7.*.com"
    - "*.ntp.org.cn"
    - "*.pool.ntp.org"

  # 仅用于解析 DNS 服务器域名，必须是 IP 或基于 IP 的加密 DNS。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 1.1.1.1
    - 8.8.8.8

  # 默认使用公共加密 DNS。
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

  # 节点域名独立使用公共 DNS 解析。
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

  # 不要在此配置 direct-nameserver：港澳版几乎所有流量都是直连，直连 DNS 一旦
  # 不可达就是全网瘫痪（2026-09-17 在 CGNAT 网络下 223.5.5.5 / 119.29.29.29 全部
  # i/o timeout，导致断网且订阅无法更新）。内地两版保留该配置。

  # 国内域名仍用国内 DoH，保证微信/支付宝/B站等 CN CDN 命中；
  # 指定代理域名使用公共 DoH，DNS 连接仍按其自身目标匹配路由。
  nameserver-policy:
    "geosite:private,cn,apple-cn,microsoft@cn,steam@cn,category-games@cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "rule-set:domestic_sensitive,domestic_ai_domain,tencent_services,tencent_games_static":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "rule-set:openai_domain,anthropic_domain,google_ai_dev,hulu_domain,streaming_special,overseas_ai_extra":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query

  respect-rules: true

# ============================================================
# Geo 数据库
# ============================================================
geodata-mode: true
geox-url!:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"
geo-auto-update: true
geo-update-interval: 24

# ============================================================
# 代理组：多地区多节点场景
# 港澳网络开放，默认全部直连。仅指定 AI/流媒体走节点。
# AI 首次默认美国组，避免跟随全局测速选到香港；仍需自行确认节点解锁。
# 可手动选择家宽或其他地区组，空地区/家宽组拒绝连接。
# ============================================================
proxy-groups:
  # 全球直连
  - name: "🎯 全球直连"
    type: select
    proxies:
      - "DIRECT"
      - "🚀 节点选择"

  # ── 香港 ──
  - name: "🇭🇰 香港"
    type: select
    include-all: true
    filter: "(?i)(香港|🇭🇰|Hong\\s*Kong|(^|[^a-z])(HK|HKG)([^a-z]|$)|葵涌|沙田|将军澳|將軍澳|大埔)"
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    empty-fallback: REJECT

  # ── 台湾 ──
  - name: "🇹🇼 台湾"
    type: select
    include-all: true
    filter: "(?i)(台湾|台灣|🇹🇼|Taiwan|(^|[^a-z])(TW|TWN|TPE)([^a-z]|$)|台北|臺北|Taipei|台中|臺中|高雄)"
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    empty-fallback: REJECT

  # ── 日本（自动/手动 二级分组）──
  - name: "🇯🇵 日本"
    type: select
    proxies:
      - "🇯🇵 日本-自动"
      - "🇯🇵 日本-手动"
      - DIRECT

  - name: "🇯🇵 日本-自动"
    type: url-test
    include-all: true
    filter: "(?i)(日本|🇯🇵|Japan|(^|[^a-z])(JP|JPN|NRT|HND|KIX)([^a-z]|$)|东京|東京|Tokyo|Osaka|大阪)"
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    empty-fallback: REJECT
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    timeout: 5000

  - name: "🇯🇵 日本-手动"
    type: select
    include-all: true
    filter: "(?i)(日本|🇯🇵|Japan|(^|[^a-z])(JP|JPN|NRT|HND|KIX)([^a-z]|$)|东京|東京|Tokyo|Osaka|大阪)"
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    proxies:
      - "🇯🇵 日本-自动"

  # ── 新加坡（自动/手动 二级分组）──
  - name: "🇸🇬 新加坡"
    type: select
    proxies:
      - "🇸🇬 新加坡-自动"
      - "🇸🇬 新加坡-手动"
      - DIRECT

  - name: "🇸🇬 新加坡-自动"
    type: url-test
    include-all: true
    filter: "(?i)(新加坡|🇸🇬|Singapore|(^|[^a-z])(SG|SGP|SIN)([^a-z]|$))"
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    empty-fallback: REJECT
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    timeout: 5000

  - name: "🇸🇬 新加坡-手动"
    type: select
    include-all: true
    filter: "(?i)(新加坡|🇸🇬|Singapore|(^|[^a-z])(SG|SGP|SIN)([^a-z]|$))"
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    proxies:
      - "🇸🇬 新加坡-自动"

  # ── 美国（自动/手动 二级分组）──
  - name: "🇺🇸 美国"
    type: select
    proxies:
      - "🇺🇸 美国-自动"
      - "🇺🇸 美国-手动"
      - DIRECT

  - name: "🇺🇸 美国-自动"
    type: url-test
    include-all: true
    filter: "(?i)(美国|美國|🇺🇸|(^|[^a-z])(US|USA|LAX|SJC|SEA|NYC)([^a-z]|$)|United\\s*States|洛杉矶|Los\\s*Angeles|圣何塞|San\\s*Jose|西雅图|Seattle|纽约|New\\s*York|芝加哥|Chicago|硅谷|Silicon\\s*Valley|达拉斯|Dallas|凤凰城|Phoenix|亚特兰大|Atlanta|迈阿密|Miami|波特兰|Portland|弗里蒙特|Fremont|圣克拉拉|Santa\\s*Clara|阿什本|Ashburn|丹佛|Denver|休斯顿|Houston|拉斯维加斯|Las\\s*Vegas|弗吉尼亚|Virginia|华盛顿|Washington|水牛城|Buffalo|坦帕|Tampa|盐湖城|Salt\\s*Lake)"
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    empty-fallback: REJECT
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    timeout: 5000

  - name: "🇺🇸 美国-手动"
    type: select
    include-all: true
    filter: "(?i)(美国|美國|🇺🇸|(^|[^a-z])(US|USA|LAX|SJC|SEA|NYC)([^a-z]|$)|United\\s*States|洛杉矶|Los\\s*Angeles|圣何塞|San\\s*Jose|西雅图|Seattle|纽约|New\\s*York|芝加哥|Chicago|硅谷|Silicon\\s*Valley|达拉斯|Dallas|凤凰城|Phoenix|亚特兰大|Atlanta|迈阿密|Miami|波特兰|Portland|弗里蒙特|Fremont|圣克拉拉|Santa\\s*Clara|阿什本|Ashburn|丹佛|Denver|休斯顿|Houston|拉斯维加斯|Las\\s*Vegas|弗吉尼亚|Virginia|华盛顿|Washington|水牛城|Buffalo|坦帕|Tampa|盐湖城|Salt\\s*Lake)"
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    proxies:
      - "🇺🇸 美国-自动"

  # 节点选择（所有节点入口）
  - name: "🚀 节点选择"
    type: select
    include-all: true
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    proxies:
      - "♻️ 自动选择"
      - DIRECT
      - "🇭🇰 香港"
      - "🇹🇼 台湾"
      - "🇯🇵 日本"
      - "🇸🇬 新加坡"
      - "🇺🇸 美国"

  - name: "♻️ 自动选择"
    type: url-test
    include-all: true
    empty-fallback: REJECT
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    timeout: 5000

  - name: "🏠 家宽"
    type: select
    include-all: true
    filter: "(?i)(家宽|家寬|原生|静态|靜態|(^|[^a-z])(Home|Residential|ISP|Static)([^a-z]|$))"
    exclude-filter: "(?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic"
    empty-fallback: REJECT

  # AI 不默认跟随全局最低延迟（澳门附近的香港出口未必支持目标 AI）。
  # 首次默认美国组；没有美国节点时会拒绝连接，请手动选可用地区。
  # 延迟测试不验证 AI 解锁，客户端保存的旧选择也不会自动被替换。
  - name: "🤖 AI 解锁"
    type: select
    proxies:
      - "🇺🇸 美国"
      - "🚀 节点选择"
      - "🏠 家宽"
      - "🇯🇵 日本"
      - "🇸🇬 新加坡"
      - "🇹🇼 台湾"
      - "🇭🇰 香港"
      - DIRECT

  # 港澳网络开放，下列海外 AI 默认直连；个别服务若按账号地区拒绝，
  # 在此组手动切到 🤖 AI 解锁 即可，不必改规则。
  - name: "🧪 AI 备选"
    type: select
    proxies:
      - DIRECT
      - "🤖 AI 解锁"
      - "🚀 节点选择"

  - name: "🎬 流媒体解锁"
    type: select
    proxies:
      - "🚀 节点选择"
      - "🇺🇸 美国"
      - "🇯🇵 日本"
      - "🇸🇬 新加坡"
      - "🇹🇼 台湾"
      - "🇭🇰 香港"
      - "🏠 家宽"
      - DIRECT

  - name: "🛑 广告拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT

# ============================================================
# 规则集
# 港澳场景大幅精简：不需要 cn/geolocation 兜底（MATCH 即直连），
# 只保留「广告拦截」+「直连保护」+「港澳不可用的代理集」。
# ============================================================
rule-providers!:
  private_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./ruleset/override/private_domain.mrs
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs"

  private_ip:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    path: ./ruleset/override/private_ip.mrs
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.mrs"

  # 以下国内直连集不是为分流（MATCH 已是直连），而是必须排在广告规则前，
  # 防止支付/银行/腾讯诊断域名被广告集误拦截。
  domestic_sensitive:
    type: inline
    behavior: classical
    payload:
      # 政务 / 公共服务
      - "DOMAIN-SUFFIX,gov.cn"
      - "DOMAIN-SUFFIX,12306.cn"
      - "DOMAIN-SUFFIX,12333.gov.cn"
      - "DOMAIN-SUFFIX,chinatax.gov.cn"
