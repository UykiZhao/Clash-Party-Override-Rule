# Clash Party YAML 覆写 · 港澳 · 多地区
# 用法：初始化客户端仅开启 TUN，导入订阅，添加并绑定本文件。
# 节点来自订阅；本文件不能作为独立订阅。一个订阅只绑定本项目的一份 YAML。
# 默认直连；指定 AI 与流媒体走代理，AI 备选默认 DIRECT。
# 源码合并、设备验收边界见 docs/validation-2026-09-25.md。

# 01 · 基础行为与选择记忆
mode: rule
ipv6: false
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true

# 02 · 自包含 DNS：整对象替换订阅 DNS
# 2.0.3 初始化 controlDns=false，DNS 策略直接随本对象生效。
# 引导解析、节点解析、业务解析分开；respect-rules 按 DNS 连接自身的目标分流。
# fake-ip 只保留兼容排除，不使用全匹配 *；监听仅开放给本机。
# 港澳默认/节点使用公共 DoH，国内策略仍用国内 DoH；不配置 direct-nameserver。
dns!:
  enable: true
  cache-algorithm: arc
  listen: 127.0.0.1:1053
  ipv6: false
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - geosite:private
    - geosite:cn
    - geosite:apple-cn
    - geosite:microsoft@cn
    - geosite:steam@cn
    - geosite:category-games@cn
    - +.lan
    - +.local
    - +.localhost
    - localhost.ptlogin2.qq.com
    - dns.msftncsi.com
    - www.msftconnecttest.com
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - +.market.xiaomi.com
    - +.push.apple.com
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.*.apple.com
    - time1.*.com
    - time2.*.com
    - time3.*.com
    - time4.*.com
    - time5.*.com
    - time6.*.com
    - time7.*.com
    - "*.ntp.org.cn"
    - "*.pool.ntp.org"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  nameserver-policy:
    geosite:private,cn,apple-cn,microsoft@cn,steam@cn,category-games@cn:
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    rule-set:domestic_sensitive,domestic_ai_domain,tencent_services,tencent_games_static:
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    rule-set:openai_domain,anthropic_domain,google_ai_dev,hulu_domain,streaming_special,custom_proxy_domain,overseas_ai_extra:
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
  respect-rules: true

# 03 · TUN：兼容应用初始化设置
# 应用在覆写后合并，最终协议栈、路由和 DNS 劫持以初始化值为准。
# 不写机器网卡或设备编号；字段存在不等于已完成系统流量接管验收。
tun!:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: true

# 04 · 域名嗅探：保留 HTTP / TLS / QUIC 与兼容排除
# 2.0.3 默认开启嗅探覆写，会覆盖部分端口、HTTP 目的地行为和 skip-domain。
# Mijia Cloud 保留在源文件中，但该版本合成后仅保留 Apple 推送排除，见验证记录。
sniffer!:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - Mijia Cloud
    - +.push.apple.com

# 05 · Geo 数据
# 保留既有源和更新意图；实际 geox-url/更新开关仍受应用默认值覆盖。
geodata-mode: true
geox-url!:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb
geo-auto-update: true
geo-update-interval: 24

# 06 · 策略组与自动回退
# AI fallback 只纳入实际候选，按家宽（港澳多地区按美国）优先，再纳入全部代理。
# 单个反引号分隔筛选优先级；空偏好不插入 REJECT，不依赖空子组的健康状态。
# 排序锚点是被信息节点过滤器排除的 REJECT 占位，不提供连接、不修改订阅节点。
# 它使 1.19.31 对直接节点、provider 及混合布局统一执行跨集合排序和去重。
# 家宽/地区手动入口仍保留；测速只判断连通，不认证 IP 属性或平台解锁。
proxy-providers:
  __override_sort_anchor:
    type: inline
    payload:
      - name: 订阅排序占位（REJECT）
        type: reject
proxy-groups:
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
  - name: 🇭🇰 香港
    type: select
    include-all: true
    filter: (?i)(香港|🇭🇰|Hong\s*Kong|(^|[^a-z])(HK|HKG)([^a-z]|$)|葵涌|沙田|将军澳|將軍澳|大埔)
    exclude-filter: (?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic
    empty-fallback: REJECT
  - name: 🇹🇼 台湾
    type: select
    include-all: true
    filter: (?i)(台湾|台灣|🇹🇼|Taiwan|(^|[^a-z])(TW|TWN|TPE)([^a-z]|$)|台北|臺北|Taipei|台中|臺中|高雄)
    exclude-filter: (?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic
    empty-fallback: REJECT
  - name: 🇯🇵 日本
    type: select
    proxies:
      - 🇯🇵 日本-自动
      - 🇯🇵 日本-手动
      - DIRECT
  - name: 🇯🇵 日本-自动
    type: url-test
    include-all: true
    filter: (?i)(日本|🇯🇵|Japan|(^|[^a-z])(JP|JPN|NRT|HND|KIX)([^a-z]|$)|东京|東京|Tokyo|Osaka|大阪)
    exclude-filter: (?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic
    empty-fallback: REJECT
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
  - name: 🇯🇵 日本-手动
    type: select
    include-all: true
    filter: (?i)(日本|🇯🇵|Japan|(^|[^a-z])(JP|JPN|NRT|HND|KIX)([^a-z]|$)|东京|東京|Tokyo|Osaka|大阪)
    exclude-filter: (?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic
    proxies:
      - 🇯🇵 日本-自动
  - name: 🇸🇬 新加坡
    type: select
    proxies:
      - 🇸🇬 新加坡-自动
      - 🇸🇬 新加坡-手动
      - DIRECT
  - name: 🇸🇬 新加坡-自动
    type: url-test
    include-all: true
    filter: (?i)(新加坡|🇸🇬|Singapore|(^|[^a-z])(SG|SGP|SIN)([^a-z]|$))
    exclude-filter: (?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic
    empty-fallback: REJECT
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
  - name: 🇸🇬 新加坡-手动
    type: select
    include-all: true
    filter: (?i)(新加坡|🇸🇬|Singapore|(^|[^a-z])(SG|SGP|SIN)([^a-z]|$))
    exclude-filter: (?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic
    proxies:
      - 🇸🇬 新加坡-自动
  - name: 🇺🇸 美国
    type: select
    proxies:
      - 🇺🇸 美国-自动
      - 🇺🇸 美国-手动
      - DIRECT
  - name: 🇺🇸 美国-自动
    type: url-test
    include-all: true
    filter: (?i)(美国|美國|🇺🇸|(^|[^a-z])(US|USA|LAX|SJC|SEA|NYC)([^a-z]|$)|United\s*States|洛杉矶|Los\s*Angeles|圣何塞|San\s*Jose|西雅图|Seattle|纽约|New\s*York|芝加哥|Chicago|硅谷|Silicon\s*Valley|达拉斯|Dallas|凤凰城|Phoenix|亚特兰大|Atlanta|迈阿密|Miami|波特兰|Portland|弗里蒙特|Fremont|圣克拉拉|Santa\s*Clara|阿什本|Ashburn|丹佛|Denver|休斯顿|Houston|拉斯维加斯|Las\s*Vegas|弗吉尼亚|Virginia|华盛顿|Washington|水牛城|Buffalo|坦帕|Tampa|盐湖城|Salt\s*Lake)
    exclude-filter: (?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic
    empty-fallback: REJECT
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
  - name: 🇺🇸 美国-手动
    type: select
    include-all: true
    filter: (?i)(美国|美國|🇺🇸|(^|[^a-z])(US|USA|LAX|SJC|SEA|NYC)([^a-z]|$)|United\s*States|洛杉矶|Los\s*Angeles|圣何塞|San\s*Jose|西雅图|Seattle|纽约|New\s*York|芝加哥|Chicago|硅谷|Silicon\s*Valley|达拉斯|Dallas|凤凰城|Phoenix|亚特兰大|Atlanta|迈阿密|Miami|波特兰|Portland|弗里蒙特|Fremont|圣克拉拉|Santa\s*Clara|阿什本|Ashburn|丹佛|Denver|休斯顿|Houston|拉斯维加斯|Las\s*Vegas|弗吉尼亚|Virginia|华盛顿|Washington|水牛城|Buffalo|坦帕|Tampa|盐湖城|Salt\s*Lake)
    exclude-filter: (?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic
    proxies:
      - 🇺🇸 美国-自动
  - name: 🚀 节点选择
    type: select
    include-all: true
    exclude-filter: (?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic
    proxies:
      - ♻️ 自动选择
      - DIRECT
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    empty-fallback: REJECT
    exclude-filter: (?i)官网|流量|剩余|到期|套餐|订阅|expire|traffic
    url: http://www.gstatic.com/generate_204
    interval: 300
