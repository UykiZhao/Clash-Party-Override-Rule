RULE-SET,https://raw.githubusercontent.com/UykiZhao/Clash-Party-Override-Rule/main/rules/shadowrocket/telemetry.list,REJECT
DOMAIN,stun.l.google.com,AI,force-remote-dns
DOMAIN,stun1.l.google.com,AI,force-remote-dns
DOMAIN,stun.cloudflare.com,AI,force-remote-dns
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/OpenAI/OpenAI.list,AI
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Claude/Claude.list,AI
